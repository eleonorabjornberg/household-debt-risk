- {id: q124, family: HB, difficulty: C, unit: pct, tolerance: 0.1, question: "By what percentage did the GSE/agency bucket's holdings of household mortgages and consumer credit grow, in nominal dollars, from 2000Q4 to 2026Q2?",
   check: {table: debt_by_risk_holder, where: {risk_bucket: gse_agency}, field: nominal_musd, op: pct_change, from: "2000-12-31", to: "2026-06-30"}}
- {id: q126, family: HB, difficulty: M, unit: share, tolerance: 0.0005, question: "What fraction of household consumer credit did banks and credit unions hold in 2026Q2?",
   check: {combine: {op: div, args: [
     {table: debt_by_risk_holder, where: {risk_bucket: banks_credit_unions, debt_type: consumer_credit}, field: nominal_musd, op: at, date: "2026-06-30"},
     {combine: {op: sub, args: [
       {table: public_share, field: scope_total_musd, op: at, date: "2026-06-30"},
       {table: collateral_coverage, where: {collateral_class: home_backed}, field: debt_musd, op: at, date: "2026-06-30"}]}}]}}}
- {id: q127, family: HB, difficulty: M, unit: pp, tolerance: 0.05, question: "How many percentage points higher or lower was the GSE/agency share of household mortgages and consumer credit in 2026Q2 than at the start (t0) of the COVID-2020 crisis window?",
   check: {combine: {op: sub, scale: 100, args: [
     {table: debt_by_risk_holder, where: {risk_bucket: gse_agency}, field: share_of_total, op: at, date: "2026-06-30"},
     {table: crisis_event_window, where: {crisis_id: covid_2020, metric: "share:gse_agency", q_offset: 0}, field: value, op: max}]}}}
- {id: q128, family: HB, difficulty: M, unit: ratio, tolerance: 0.01, question: "In 2026Q2, what was the ratio of banks and credit unions' Z.1 holdings of household mortgages to the NY Fed's mortgage balance?",
