     {table: nyfed_by_type, where: {loan_type: mortgage}, field: balance_busd, op: at, date: "2026-06-30"}]}}}
- {id: q129, family: HB, difficulty: M, unit: share, tolerance: 0.0005, question: "In 2026Q2, what fraction of the public share of household mortgages and consumer credit did state and local governments account for?",
