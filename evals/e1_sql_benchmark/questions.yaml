- {id: q142, family: CW, difficulty: M, unit: ratio, tolerance: 0.01, question: "How much higher or lower was the home-backed collateral coverage ratio in 2026Q2 than at the start (t0) of the GFC 2007 crisis window? Give 2026Q2 minus t0.",
