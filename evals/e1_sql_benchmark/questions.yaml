# E1 question set: DRAFT by Claude, for Eleonora's approval (CHOICE-E1-3 (a)). Not frozen; not seen by any model.
# Design (her choices, 2026-11-05, PLAN.md "Decisions taken" at 77460b4, c55701b): stratified by tool family x difficulty,
# 25 unanswerable after e1-set-h3 "replace" (CHOICE-E1-1 (a), h3 (b)); gold checked two ways with no model: path 1 the snapshot the MCP
# server serves, path 2 a validation-PASS register row whose check recomputes the value from the raw Z.1 zip /
# NY Fed workbook (CHOICE-E1-2 (b)); 20 questions held back for E3 (CHOICE-E1-13 (b), verify_set.py, seed 20261104),
# about 5 of them unanswerable (e1-holdback), by largest-remainder allocation.
# The 10 pilot questions (pilot_questions.yaml) are not reused.
#
# Families: PS public_share · HB holdings_by_bucket · CW crisis_windows · CC collateral_coverage · NY nyfed_by_type
#           · RG register / coverage (lookup_claim, list_series, data_coverage)
# Difficulty: L one lookup · C a computation (difference, growth, argmax, mean, sum) · M needs two tools
# Units and tolerances (scoring rule (a), as in the pilot): share 0.0005 (fraction) · pp 0.05 · usd_tn 0.01 ·
#   usd_bn 1 (NY Fed balances are published to $1B) · pct 0.01 for NY Fed rates, 0.1 for growth · ratio 0.01 · count 0
# Unanswerable (refuse: true): correct only if no number is given and the reply says the data cannot answer.
# `register`: an existing PASS row (pilot-style check), or e1_<id> rows built by build_register.py from the E1-<id>
# checks in validation/results.json.
questions:
# ---------------------------------------------------------------- PS public_share (13)
- {id: q101, family: PS, difficulty: L, unit: share, tolerance: 0.0005, question: "What was the public share of household mortgages and consumer credit in 2000Q4?",
   check: {table: public_share, field: public_share, op: at, date: "2000-12-31"}}
- {id: q103, family: PS, difficulty: L, unit: share, tolerance: 0.0005, question: "What share of household consumer credit was held by public holders in 2011Q4?",
   check: {table: public_share, field: public_share_cc, op: at, date: "2011-12-31"}}
- {id: q104, family: PS, difficulty: L, unit: usd_tn, tolerance: 0.01, question: "What was the total of household 1-4 family mortgages plus consumer credit in 2007Q4, in trillions of dollars?",
   check: {table: public_share, field: scope_total_musd, op: at, date: "2007-12-31", scale: 1.0e-6}}
- {id: q105, family: PS, difficulty: L, unit: usd_tn, tolerance: 0.01, question: "How many trillion dollars of household mortgages and consumer credit did public holders hold in 2011Q4?",
   check: {table: public_share, field: public_musd, op: at, date: "2011-12-31", scale: 1.0e-6}}
- {id: q106, family: PS, difficulty: C, unit: pp, tolerance: 0.05, question: "By how many percentage points did the public share of household mortgages and consumer credit change from 2019Q4 to 2026Q2?",
   check: {table: public_share, field: public_share, op: diff, from: "2019-12-31", to: "2026-06-30", scale: 100}}
- {id: q107, family: PS, difficulty: C, unit: share, tolerance: 0.0005, quarter: true, question: "Between 1952Q1 and 1970Q4, in which quarter was the public share of household mortgages and consumer credit lowest, and what was it?",
   check: {table: public_share, field: public_share, op: argmin, start: "1952-03-31", end: "1970-12-31"}}
- {id: q108, family: PS, difficulty: C, unit: share, tolerance: 0.0005, quarter: true, question: "In which quarter did the public share of household consumer credit reach its highest level, and what was it?",
   check: {table: public_share, field: public_share_cc, op: argmax}}
- {id: q109, family: PS, difficulty: C, unit: pct, tolerance: 0.1, question: "By what percentage did the total of household mortgages plus consumer credit grow from 2011Q4 to 2026Q2?",
   check: {table: public_share, field: scope_total_musd, op: pct_change, from: "2011-12-31", to: "2026-06-30"}}
- {id: q111, family: PS, difficulty: M, unit: pp, tolerance: 0.05, question: "In 2026Q2, how many percentage points of the public share of household mortgages and consumer credit were not held by the GSE/agency bucket?",
   check: {combine: {op: sub, scale: 100, args: [
     {table: public_share, field: public_share, op: at, date: "2026-06-30"},
     {table: debt_by_risk_holder, where: {risk_bucket: gse_agency}, field: share_of_total, op: at, date: "2026-06-30"}]}}}
- {id: q112, family: PS, difficulty: M, unit: ratio, tolerance: 0.01, question: "In 2026Q2, what was the ratio of public holders' Z.1 holdings of household mortgages and consumer credit to the NY Fed's total household debt balance (all six loan types)?",
   check: {combine: {op: div, args: [
     {table: public_share, field: public_musd, op: at, date: "2026-06-30", scale: 0.001},
     {table: nyfed_by_type, field: balance_busd, op: at, date: "2026-06-30"}]}}}
- {id: q113, family: PS, difficulty: M, unit: usd_tn, tolerance: 0.01, question: "How many trillion dollars of household 1-4 family mortgages did public holders hold in 2007Q4?",
   check: {combine: {op: mul, scale: 1.0e-6, args: [
     {table: public_share, field: public_share_mortgage, op: at, date: "2007-12-31"},
     {table: collateral_coverage, where: {collateral_class: home_backed}, field: debt_musd, op: at, date: "2007-12-31"}]}}}
- {id: q114, family: PS, difficulty: M, unit: usd_tn, tolerance: 0.01, question: "How many trillion dollars of household consumer credit did public holders hold in 2026Q2?",
   check: {combine: {op: mul, scale: 1.0e-6, args: [
     {table: public_share, field: public_share_cc, op: at, date: "2026-06-30"},
     {combine: {op: sub, args: [
       {table: public_share, field: scope_total_musd, op: at, date: "2026-06-30"},
       {table: collateral_coverage, where: {collateral_class: home_backed}, field: debt_musd, op: at, date: "2026-06-30"}]}}]}}}
- {id: q115, family: PS, difficulty: M, unit: share, tolerance: 0.0005, question: "In 2026Q2, what fraction of public holders' share of household mortgages and consumer credit belonged to the federal government (direct) bucket?",
   check: {combine: {op: div, args: [
     {table: debt_by_risk_holder, where: {risk_bucket: federal_direct}, field: share_of_total, op: at, date: "2026-06-30"},
     {table: public_share, field: public_share, op: at, date: "2026-06-30"}]}}}
# ---------------------------------------------------------------- HB holdings_by_bucket (13)
