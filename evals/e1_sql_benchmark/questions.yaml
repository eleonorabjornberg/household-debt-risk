- {id: q132, family: CW, difficulty: L, unit: ratio, tolerance: 0.01, question: "In the GFC 2007 crisis window, what was the home-backed collateral coverage ratio at the window's start (t0)?",
   check: {table: crisis_event_window, where: {crisis_id: gfc_2007, metric: "coverage:home_backed", q_offset: 0}, field: value, op: max}}
- {id: q133, family: CW, difficulty: L, unit: pp, tolerance: 0.05, question: "In the 1990 S&L crisis window, by how many percentage points had the public share changed 16 quarters after the window's start?",
