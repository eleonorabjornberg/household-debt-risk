name: refresh-data

# Manual only (decision F3-1, Eleonora, 2026-11-04): load the database after a z1-release PR has been
# reviewed and merged (Actions -> refresh-data -> Run workflow, load = true). New releases are detected,
# rebuilt and proposed by z1-release.yml, which never loads or deploys; nothing here runs on a schedule,
# so no data reach the sites before her merge.
on:
  workflow_dispatch:
    inputs:
      load:
        description: "Load into the production database (DATABASE_URL secret). Only after merging a reviewed z1-release PR."
        type: boolean
        default: false

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: ${{ inputs.load && secrets.DATABASE_URL || '' }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      HHDEBT_REQUIRE_DATA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Run pipeline (extract -> transform -> load -> export-snapshot)
        run: uv run hhdebt run --export

      - name: Tests
        run: uv run pytest -ra

      - name: Upload snapshots + transform output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-snapshots-${{ github.run_id }}
          path: |
            web/public/data/*.json
            data/out/
          if-no-files-found: warn
          retention-days: 90
