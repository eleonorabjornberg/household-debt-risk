[project]
name = "hhdebt"
version = "0.1.0"
description = "Who Holds the Debt? data pipeline: Z.1 / FRED / NY Fed HHDC -> Supabase Postgres (raw -> core -> mart)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "requests>=2.32",
]

[project.scripts]
hhdebt = "hhdebt.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hhdebt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
