# Single source of truth for every series the pipeline loads.
#
# Units: Z.1 levels are millions of USD, end of quarter, not seasonally adjusted.
# Source of Z.1: https://www.federalreserve.gov/releases/z1/data/FRB_Z1_csv.zip
#   (long CSV; series_name like "Z1/Z1/FL153165105.Q"). The old DDP endpoint is being retired (Nov 2026).
#
# Scope: household (incl. nonprofit) 1-4 family mortgages + consumer credit
#   = FL154104015 (~87% of total household liabilities FL154190005).
#
# Mortgage holders are reported for ALL 1-4 family mortgages (FL893065105), which also includes
# business borrowers. Each holder's share of FL893065105 is applied to the household liability
# FL153165105 ("apportioned"). The 17 holders below sum to FL893065105 exactly (verified 1945-2026).
# Consumer credit holders sum to FL153166000 exactly (verified 1945-2026).

risk_buckets:
  federal_direct:        {label: "Federal government (direct)", public: true}
  gse_agency:            {label: "GSEs & agency pools", public: true}
  state_local:           {label: "State & local governments", public: true}
  banks_credit_unions:   {label: "Banks & credit unions", public: false}
  private_securitization: {label: "Private securitization & mortgage REITs", public: false}
  nonbank_other:         {label: "Finance companies & other private", public: false}

collateral_classes:
  home_backed:      {label: "Home-backed (appreciating)", collateral_series: FL155035015}
  vehicle_backed:   {label: "Vehicle-backed (depreciating)", collateral_series: FL155111005}
  uncollateralized: {label: "No collateral (cards, student)", collateral_series: null}
  other_nonrevolving: {label: "Other non-revolving (mixed)", collateral_series: null}

series:
  # ---- Totals / identities -------------------------------------------------
  - {id: FL154190005, source: z1, role: total, desc: "HH&NP total liabilities"}
  - {id: FL154104015, source: z1, role: total, desc: "HH&NP 1-4 family mortgages + consumer credit (scope total)"}
  - {id: FL153165105, source: z1, role: total, debt_type: mortgage, collateral_class: home_backed, desc: "HH&NP 1-4 family mortgages; liability"}
  - {id: FL153166000, source: z1, role: total, debt_type: consumer_credit, desc: "HH&NP consumer credit; liability"}
  - {id: FL893065105, source: z1, role: total, desc: "All sectors; 1-4 family mortgages; asset (holder total)"}

  # ---- Consumer credit by type (liability side) ----------------------------
  - {id: FL153166100, source: z1, role: cc_type, collateral_class: uncollateralized, desc: "Revolving consumer credit"}
  - {id: FL153166220, source: z1, role: cc_type, collateral_class: uncollateralized, desc: "Student loans"}
  - {id: FL153166400, source: z1, role: cc_type, collateral_class: vehicle_backed, desc: "Auto loans"}
  - {id: FL153166205, source: z1, role: cc_type, collateral_class: other_nonrevolving, desc: "Other non-revolving"}
  # NOTE: verify the four types sum to FL153166000 and record from what date the split is populated.

  # ---- Collateral values ----------------------------------------------------
  - {id: FL155035015, source: z1, role: collateral, desc: "Owner-occupied real estate at market value"}
  - {id: FL155111005, source: z1, role: collateral, desc: "Consumer durable goods, current cost (proxy for vehicle collateral; overstates it)"}

  # ---- 1-4 family mortgage holders (asset side) -----------------------------
  - {id: FL313065105, source: z1, role: mortgage_holder, risk_bucket: federal_direct, desc: "Federal government"}
  - {id: FL403065105, source: z1, role: mortgage_holder, risk_bucket: gse_agency, desc: "GSEs (incl. consolidated MBS after 2010)"}
  - {id: FL413065105, source: z1, role: mortgage_holder, risk_bucket: gse_agency, desc: "Agency- and GSE-backed mortgage pools"}
  - {id: FL213065103, source: z1, role: mortgage_holder, risk_bucket: state_local, desc: "State & local governments"}
  - {id: FL763065105, source: z1, role: mortgage_holder, risk_bucket: banks_credit_unions, desc: "U.S.-chartered depository institutions"}
  - {id: FL753065103, source: z1, role: mortgage_holder, risk_bucket: banks_credit_unions, desc: "Foreign banking offices in U.S."}
  - {id: FL743065103, source: z1, role: mortgage_holder, risk_bucket: banks_credit_unions, desc: "Banks in U.S.-affiliated areas"}
  - {id: FL473065100, source: z1, role: mortgage_holder, risk_bucket: banks_credit_unions, desc: "Credit unions"}
  - {id: FL673065105, source: z1, role: mortgage_holder, risk_bucket: private_securitization, desc: "Issuers of ABS (private label)"}
  - {id: FL643065173, source: z1, role: mortgage_holder, risk_bucket: private_securitization, desc: "Mortgage REITs"}
  - {id: FL153065103, source: z1, role: mortgage_holder, risk_bucket: nonbank_other, desc: "Households & nonprofits (seller financing)"}
  - {id: FL103065105, source: z1, role: mortgage_holder, risk_bucket: nonbank_other, desc: "Nonfinancial corporate business"}
  - {id: FL113065103, source: z1, role: mortgage_holder, risk_bucket: nonbank_other, desc: "Nonfinancial noncorporate business"}
  - {id: FL543065105, source: z1, role: mortgage_holder, risk_bucket: nonbank_other, desc: "Life insurance companies"}
  - {id: FL573065103, source: z1, role: mortgage_holder, risk_bucket: nonbank_other, desc: "Private pension funds"}
  - {id: FL223065143, source: z1, role: mortgage_holder, risk_bucket: nonbank_other, desc: "State & local DB pension funds"}
  - {id: FL613065105, source: z1, role: mortgage_holder, risk_bucket: nonbank_other, desc: "Finance companies"}

  # ---- Consumer credit holders (asset side) ---------------------------------
  - {id: FL313066220, source: z1, role: cc_holder, risk_bucket: federal_direct, desc: "Federal government (student loans)"}
  - {id: FL403066005, source: z1, role: cc_holder, risk_bucket: gse_agency, desc: "GSE: Sallie Mae (until privatized 2004)"}
  - {id: FL763066005, source: z1, role: cc_holder, risk_bucket: banks_credit_unions, desc: "U.S.-chartered depository institutions"}
  - {id: FL473066000, source: z1, role: cc_holder, risk_bucket: banks_credit_unions, desc: "Credit unions"}
  - {id: FL673066000, source: z1, role: cc_holder, risk_bucket: private_securitization, desc: "Issuers of ABS"}
  - {id: FL613066005, source: z1, role: cc_holder, risk_bucket: nonbank_other, desc: "Finance companies"}
  - {id: FL103066003, source: z1, role: cc_holder, risk_bucket: nonbank_other, desc: "Nonfinancial corporate business (retailers)"}
  - {id: FL113066003, source: z1, role: cc_holder, risk_bucket: nonbank_other, desc: "Nonfinancial noncorporate business"}
  - {id: FL163066223, source: z1, role: cc_holder, risk_bucket: nonbank_other, desc: "Nonprofits (student loans)"}

  # ---- Context (FRED) --------------------------------------------------------
  - {id: WSHOMCB,  source: fred, role: overlay, desc: "Fed: MBS held outright (wkly, $M) — subset of agency pools; QE overlay, never summed"}
  - {id: CPIAUCSL, source: fred, role: context, desc: "CPI-U (monthly, SA) for real dollars"}
  - {id: DSPI,     source: fred, role: context, desc: "Disposable personal income (SAAR, $B)"}
  - {id: UNRATE,   source: fred, role: context, desc: "Unemployment rate"}
  - {id: CSUSHPINSA, source: fred, role: context, desc: "Case-Shiller national HPI (1987+)"}

  # ---- NY Fed Household Debt & Credit (2003+), payment-priority panel ---------
  # Source: https://www.newyorkfed.org/microeconomics/hhdc -> HHD_C_Report_YYYYQn.xlsx
  # Load: balances by type (mortgage, HELOC, auto, card, student, other) and
  #       "transition into serious delinquency (90+)" by type.
  - {id: NYFED_HHDC, source: nyfed, role: nyfed, desc: "NY Fed CCP tables, quarterly 2003Q1+"}

# ---- Context sources (NOT loaded by the pipeline) --------------------------------------------------
# Research-only sources outside the pipeline's extract -> transform -> load. Nothing reads this section
# except people and the sites' /methods page copy; `series` above stays the pipeline's single list.
context_sources:
  - id: cbo_spending_detail
    publisher: Congressional Budget Office
    title: "Spending Projections by Budget Account (publication 51142)"
    repository: https://github.com/US-CBO/cbo-data
    commit: 284a95665f9f2f74ed1f482feb629b43fce323da
    files: "data/budget/spending_detail/annual_fy_{2024-06,2025-01,2026-02}.csv"
    accounts: ["091-0243-0-1-502 Federal Direct Student Loan Program Account (Mandatory)"]
    units: "USD millions, outlays and budget authority by federal fiscal year"
    used_by: "B4 student-loan scenario, as a labelled budget-side proxy (research/b4_policy_scenarios/, METHOD.md 3b)"
    decision: "cbo-repo-55 (b), Eleonora, 2026-11-11: budget-side context only"
    provenance: research/b4_policy_scenarios/sources.md
    note: "Program-account outlays are subsidy cost (2 U.S.C. 661a), not loan volume. No fair-value estimates (A6)."
  - id: ed_rule_91fr23768_table_3_1
    publisher: U.S. Department of Education
    title: "Reimagining and Improving Student Education - Federal Student Loan Program Final Regulations, 91 FR 23768, RIA Table 3.1 (FR 23855)"
    url: https://www.govinfo.gov/content/pkg/FR-2026-05-01/pdf/2026-08556.pdf
    sha256: 21ef3bab376f85734582ebd3e10e7c89133c00c99e6be5d2c1aec671483f56ac
    units: "USD millions, federal student-loan disbursements 2026-2035 by loan type, ED 'Pre' and 'Post' columns"
    used_by: "B4 student-loan scenario, volume side beside the CBO proxy (research/b4_policy_scenarios/, METHOD.md 3c)"
    decision: "docket 56 (b), Eleonora, 2026-11-11: add ED's loan-volume estimate after a source check; no loss-engine change until she reviews it"
    provenance: research/b4_policy_scenarios/sources.md
    note: "Federal lending only; the private side is not estimated. Not combined with the CBO proxy."

