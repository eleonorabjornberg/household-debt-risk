[project]
name = "household-credit-mcp"
version = "0.1.0"
description = "Read-only MCP server over the household-debt-risk warehouse (Z.1, NY Fed CCP): who holds US household credit risk."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2,<2", "pyyaml>=6", "psycopg[binary]>=3.1"]

[project.scripts]
household-credit-mcp = "household_credit_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/household_credit_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
